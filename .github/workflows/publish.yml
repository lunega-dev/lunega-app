# Publishes every @lunega/* package whose version isn't on npm yet. Bump a
# package's version to release it; everything else is skipped.
#
# Auth is npm trusted publishing (GitHub OIDC), so there is no token: each
# package lists lunega-dev/lunega-app + publish.yml as its trusted publisher on
# npmjs.com. A brand-new package has to be published once by hand first.
name: publish

on:
  push:
    branches: [main]
    paths:
      - js/modules/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: js/modules

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish new versions
        run: |
          for dir in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # The version URL, not npm view: the package document lags behind
            # a fresh publish, and publishing over a version is a 403.
            if curl -sf -o /dev/null "https://registry.npmjs.org/$name/$version"; then
              echo "$name@$version is already published"
            else
              npm publish --workspace "$dir"
            fi
          done
