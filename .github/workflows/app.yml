# Builds an app on @lunega/app with js/Dockerfile. On main it pushes
# ghcr.io/<owner>/<repo>:main and tells the owning user's ci-notify on europa,
# which checks this run's OIDC token and has WUD update the container.
#
# Caller (.github/workflows/app.yml in the app's repo):
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     packages: write
#     id-token: write
#   jobs:
#     app:
#       uses: lunega-dev/lunega-app/.github/workflows/app.yml@main
#       with:
#         user: beeps
name: app

on:
  workflow_call:
    inputs:
      user:
        description: europa user(s) that run the app, space-separated (beeps, lunega)
        required: true
        type: string
      path:
        description: app directory within the repo
        type: string
        default: .
      node-version:
        type: string
        default: '24'

# Explicit, so steps get -o pipefail (the default bash shell is only -e).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check inputs
        id: meta
        env:
          USER_INPUT: ${{ inputs.user }}
        run: |
          receivers=()
          for user in $USER_INPUT; do
            case "$user" in
              beeps|lunega) receivers+=("notify.ci.$user.europa.lunega.io") ;;
              *) echo "::error::user must be beeps or lunega, not '$user'"; exit 1 ;;
            esac
          done
          (( ${#receivers[@]} )) || { echo "::error::no user given"; exit 1; }
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "receivers=${receivers[*]}"
            echo "receiver=${receivers[0]}"
          } >> "$GITHUB_OUTPUT"

      # This run's OIDC token says which commit of this workflow is running, so
      # the Dockerfile comes from that same commit.
      - name: Workflow commit
        id: oidc
        env:
          AUDIENCE: ${{ steps.meta.outputs.receiver }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+='='; done
          echo "workflow-sha=$(base64 -d <<< "$payload" | jq -r .job_workflow_sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: lunega-dev/lunega-app
          ref: ${{ steps.oidc.outputs.workflow-sha }}
          path: .lunega-app
          sparse-checkout: js/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ inputs.path }}
          file: .lunega-app/js/Dockerfile
          build-args: NODE_VERSION=${{ inputs.node-version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify europa
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RECEIVERS: ${{ steps.meta.outputs.receivers }}
        run: |
          media_type=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -r .mediaType)
          body=$(jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg mediaType "$media_type" \
            '{image: $image, tag: "main", digest: $digest, mediaType: $mediaType}')
          for receiver in $RECEIVERS; do
            # A fresh token per receiver: the audience differs, and they're
            # short-lived while the build may have been slow.
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$receiver" | jq -r .value)
            echo "::add-mask::$token"
            # An assignment, so a refusal fails the step.
            response=$(curl -sS --fail-with-body -X POST "https://$receiver/" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$body")
            echo "$receiver: $response"
          done
